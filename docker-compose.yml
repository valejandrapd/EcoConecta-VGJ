# Chatbot de EcoConecta + PostgreSQL.   Uso:  cp chatbot/.env.example .env   (completa los valores)   y luego   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecoconecta
      POSTGRES_USER: ecoconecta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoconecta -d ecoconecta"]
      interval: 5s
      timeout: 5s
      retries: 10

  chatbot:
    build: ./chatbot
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecoconecta:${POSTGRES_PASSWORD}@db:5432/ecoconecta
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
